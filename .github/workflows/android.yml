name: Build Android app

on:
  push:
    branches: [main]
    paths: ["web/**", "android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Put the web app inside the Android app
        run: |
          mkdir -p android/app/src/main/assets
          cp web/index.html android/app/src/main/assets/index.html

      - name: Build the APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          if ! gradle assembleRelease --no-daemon 2>&1 | tee build.log; then
            grep -E "error:|\.java:[0-9]+|What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk Wallet.apk

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: Wallet-apk
          path: Wallet.apk

      - name: Publish to the download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Wallet app
          make_latest: true
          overwrite_files: true
          files: Wallet.apk
          body: |
            **Download:** tap `Wallet.apk` below, open it, and allow "Install unknown apps" when Android asks.
            Version 1.0.${{ github.run_number }}. Updates install over the old version and keep your data.
