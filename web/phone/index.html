<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fff7ea">
<meta name="robots" content="noindex">
<title>Учимся пользоваться телефоном</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff8a3d'/%3E%3Crect x='20' y='8' width='24' height='48' rx='6' fill='%23fff'/%3E%3Ccircle cx='32' cy='48' r='3' fill='%23ff8a3d'/%3E%3C/svg%3E">
<style>
  :root{--bg:#fff7ea;--ink:#2a2118;--muted:#7b6c5a;--card:#fff;--line:#eadcc6;--brand:#ff8a3d;--brand2:#e56a12;--ok:#1f9d5b;--bad:#d8402f;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overscroll-behavior:none;}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;justify-content:center;user-select:none;-webkit-user-select:none;}
  .col{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:10px;}
  .hide{display:none!important;}
  button{font:inherit;color:inherit;cursor:pointer;}
  /* ---------- menu ---------- */
  #menu{overflow-y:auto;}
  #menu h1{font-size:28px;line-height:1.15;margin:8px 0 4px;font-weight:800;}
  #menu .sub{color:var(--muted);font-size:17px;line-height:1.4;margin:0 0 6px;}
  .langs{display:flex;gap:8px;margin:4px 0;}
  .langs button{flex:1;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px;font-weight:700;font-size:17px;}
  .langs button.on{border-color:var(--brand);background:#fff0e0;}
  .lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:start;border:2px solid var(--line);background:var(--card);border-radius:20px;padding:14px;margin:0 0 10px;}
  .lesson .n{flex:0 0 52px;height:52px;border-radius:16px;background:#fff0e0;color:var(--brand2);font-weight:800;font-size:22px;display:grid;place-items:center;}
  .lesson.done .n{background:#dff5e8;color:var(--ok);}
  .lesson.next{border-color:var(--brand);box-shadow:0 6px 18px rgba(255,138,61,.25);}
  .lesson b{display:block;font-size:20px;line-height:1.2;}
  .lesson span{display:block;color:var(--muted);font-size:15.5px;margin-top:3px;line-height:1.3;}
  /* ---------- coach ---------- */
  .coach{position:absolute;left:10px;right:10px;top:44px;z-index:50;max-height:52%;overflow-y:auto;background:var(--card);color:var(--ink);border:3px solid var(--brand);border-radius:20px;padding:10px 14px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45);}
  .coach.bottom{top:auto;bottom:66px;}
  .ctop{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .ctop .bar{flex:1;margin:0;}
  .ctop .ttl{flex:1;font-weight:700;color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ctop button{border:2px solid var(--line);background:#fff;border-radius:12px;height:38px;min-width:44px;padding:0 8px;font-size:16px;font-weight:700;}
  .bar{height:8px;border-radius:5px;background:#f1e6d3;overflow:hidden;margin-bottom:10px;}
  .bar i{display:block;height:100%;background:var(--brand);border-radius:5px;transition:width .4s;}
  #say{font-size:19px;line-height:1.36;font-weight:600;}
  #say.in{animation:sayin .35s;}
  @keyframes sayin{from{opacity:0;transform:translateY(6px);}}
  #hint{margin-top:8px;font-size:17px;font-weight:700;color:var(--bad);line-height:1.3;}
  #hint.good{color:var(--ok);}
  .doneBox{text-align:center;padding:6px 0;}
  .doneBox .big{font-size:26px;font-weight:800;margin:4px 0 10px;}
  .cta{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-size:20px;font-weight:800;color:#fff;background:linear-gradient(180deg,var(--brand),var(--brand2));margin-top:8px;}
  .cta.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);}
  /* ---------- the practice phone ---------- */
  /* the practice phone fills the whole real screen; the teacher's note floats over it */
  #lessonView{position:fixed;inset:0;background:#0b0c10;display:flex;justify-content:center;}
  .phonebox{position:relative;height:100%;width:100%;max-width:calc(100dvh*9/16);}
  .frame{position:absolute;inset:0;background:#15161a;touch-action:none;}
  @media (min-width:560px){.phonebox{margin:10px 0;height:calc(100% - 20px);max-width:calc((100dvh - 20px)*9/17);}.frame{border-radius:28px;padding:8px;}#sim{border-radius:22px!important;}}
  .frame.torch{box-shadow:0 0 0 6px #fff7b0,0 0 60px 20px rgba(255,235,120,.9);}
  .hw{position:absolute;right:0;width:.75em;background:#3a3c44;border-radius:.4em 0 0 .4em;z-index:30;box-shadow:0 0 0 2px rgba(255,255,255,.35);}
  .hw::after{content:"";position:absolute;inset:-.5em 0 -.5em -1.6em;}
  .hw.vu{top:17%;height:8%;}.hw.vd{top:26%;height:8%;}.hw.pw{top:40%;height:9%;background:#ff8a3d;}
  #sim{position:relative;width:100%;height:100%;border-radius:0;overflow:hidden;background:linear-gradient(160deg,#7fb6ff,#a78bfa 55%,#f6a6c9);color:#fff;display:flex;flex-direction:column;}
  .sb{display:flex;justify-content:space-between;align-items:center;padding:.5em 1.1em .3em;font-size:.82em;font-weight:700;flex:0 0 auto;position:relative;z-index:6;}
  .sb .r{display:flex;gap:.5em;align-items:center;}
  .sb svg{width:1.25em;height:1.25em;display:block;}
  .sb [data-ev]{padding:.35em;margin:-.2em;border-radius:.5em;}
  .dock .app{font-size:.6em;}.dock .app .ic{width:5em;height:5em;}.dock .app .ic svg{width:2.9em;height:2.9em;}
  .scr{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;}
  .nav{flex:0 0 auto;display:flex;justify-content:space-around;align-items:center;padding:.35em 2em .55em;background:rgba(0,0,0,.28);position:relative;z-index:6;}
  .nav div{width:3.2em;height:2.2em;display:grid;place-items:center;border-radius:1em;}
  .nav svg{width:1.3em;height:1.3em;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1em .3em;padding:1.4em .7em;align-content:start;flex:1;}
  .app{display:flex;flex-direction:column;align-items:center;gap:.3em;font-size:.72em;font-weight:600;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.4);border-radius:1em;padding:.2em 0;}
  .app .ic{position:relative;width:4.2em;height:4.2em;border-radius:1.25em;display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.25);}
  .app .ic svg{width:2.4em;height:2.4em;}
  .dock{display:grid;grid-template-columns:repeat(4,1fr);padding:.6em .7em .7em;background:rgba(255,255,255,.22);margin:0 .6em .6em;border-radius:1.6em;}
  .pgdots{display:flex;gap:.4em;justify-content:center;padding:.4em;}
  .pgdots i{width:.45em;height:.45em;border-radius:50%;background:rgba(255,255,255,.5);}.pgdots i.on{background:#fff;}
  .press{transform:scale(.92);filter:brightness(.85);}
  .hl{position:relative;z-index:5;animation:hl 1.2s ease-in-out infinite;border-radius:1em;}
  @keyframes hl{0%,100%{box-shadow:0 0 0 .18em #ffd400,0 0 0 .5em rgba(255,212,0,.35);}50%{box-shadow:0 0 0 .3em #ffd400,0 0 0 1em rgba(255,212,0,.0);}}
  .hw.hl{animation:hl 1.2s ease-in-out infinite;}
  /* spotlight: everything is dimmed except the thing to touch */
  .hole{position:absolute;z-index:25;pointer-events:none;border-radius:1em;box-shadow:0 0 0 .22em #ffd400,0 0 0 300em rgba(8,8,16,.58);animation:holep 1.1s ease-in-out infinite;}
  @keyframes holep{50%{box-shadow:0 0 0 .5em #ffd400,0 0 0 300em rgba(8,8,16,.58);}}
  .finger{position:absolute;z-index:26;pointer-events:none;font-size:2.8em;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6));animation:fing .8s ease-in-out infinite;}
  .finger.dn{animation-name:fing2;}
  @keyframes fing{50%{transform:translateY(.25em);}}
  @keyframes fing2{50%{transform:translateY(-.25em);}}
  .dimall{position:absolute;inset:0;z-index:24;pointer-events:none;background:rgba(8,8,16,.35);}
  .badge{position:absolute;top:-.3em;right:-.3em;min-width:1.5em;height:1.5em;border-radius:1em;background:#e5412f;color:#fff;font-size:.95em;font-weight:800;display:grid;place-items:center;border:.12em solid #fff;}
  .banner{position:absolute;left:.6em;right:.6em;top:2.4em;z-index:9;background:#fff;color:#111;border-radius:1.2em;padding:.7em .9em;font-size:.9em;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:sh .3s;}
  .note[data-ev]{background:#fff;color:#111;}
  .chat{position:relative;}
  .bmenu{position:absolute;left:12%;z-index:7;background:#fff;color:#111;border-radius:1em;box-shadow:0 8px 26px rgba(0,0,0,.4);font-size:.95em;font-weight:700;overflow:hidden;}
  .bmenu div{padding:.8em 1.3em;border-bottom:1px solid #eee;}
  .gtool{display:flex;background:#111;color:#fff;flex:0 0 auto;}
  .gtool div{flex:1;display:flex;flex-direction:column;align-items:center;gap:.2em;padding:.7em;font-size:.8em;font-weight:700;border-radius:1em;}
  .gtool svg{width:1.8em;height:1.8em;}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:7;background:#fff;color:#111;border-radius:1.4em 1.4em 0 0;padding:1em;box-shadow:0 -8px 30px rgba(0,0,0,.5);animation:shu .25s;}
  @keyframes shu{from{transform:translateY(100%);}}
  .sheet .srow{display:grid;grid-template-columns:repeat(3,1fr);margin-top:.9em;}
  .fldbox{border:2px solid #d5d8de;border-radius:.8em;padding:.7em .9em;font-size:1.05em;min-height:2.7em;}
  .addc{flex:0 0 2.6em;height:2.6em;border-radius:50%;background:#e8f0fe;color:#1a73e8;display:grid;place-items:center;font-size:1.2em;font-weight:800;}
  .lnk{color:#1a73e8;font-weight:600;word-break:break-all;}
  .sbtn{background:#1a73e8;color:#fff;border-radius:1.4em;padding:.6em 1.2em;font-weight:800;font-size:.9em;text-align:center;}
  .hand{position:absolute;z-index:30;font-size:2.6em;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));}
  .hand.left{top:45%;left:70%;animation:hL 1.6s ease-in-out infinite;}
  .hand.right{top:45%;left:15%;animation:hR 1.6s ease-in-out infinite;}
  .hand.down{top:0;left:44%;animation:hD 1.6s ease-in-out infinite;}
  .hand.downr{top:0;left:72%;animation:hD 1.6s ease-in-out infinite;}
  .hand.downl{top:0;left:12%;animation:hD 1.6s ease-in-out infinite;}
  /* control centre in the Xiaomi style */
  .cc{background:rgba(70,78,92,.96)!important;gap:.8em!important;padding-top:1.6em!important;}
  .cchead{display:flex;justify-content:space-between;align-items:center;font-size:.85em;font-weight:600;padding:0 .3em .2em;}
  .cchead .r{display:flex;gap:.35em;align-items:center;}.cchead svg{width:1.2em;height:1.2em;}
  .ccgrid{display:grid;grid-template-columns:1fr 1fr;gap:.6em;}
  .q.big{border-radius:1.5em;min-height:4.2em;background:rgba(20,24,34,.55);}
  .q.big.on{background:#fff;color:#111;}.q.big.on svg{color:#2f7df6;}
  .q.big[data-ev="qs:data"].on svg{color:#1f9d5b;}
  .media{flex:1;min-height:8em;border-radius:1.5em;background:rgba(20,24,34,.55);padding:.9em;display:flex;flex-direction:column;justify-content:space-between;font-size:.8em;}
  .media .mc{font-size:1.4em;text-align:center;}
  .vslider{flex:1;min-height:8em;border-radius:1.5em;background:rgba(20,24,34,.55);position:relative;overflow:hidden;}
  .vslider i{position:absolute;left:0;right:0;bottom:0;background:#fff;}
  .vslider span{position:absolute;bottom:.6em;left:0;right:0;text-align:center;color:#f5a623;font-size:1.3em;}
  .rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.9em .6em;justify-items:center;padding:.4em 0;}
  .rq{width:3.7em;height:3.7em;border-radius:50%;background:rgba(20,24,34,.6);display:grid;place-items:center;}
  .rq svg{width:1.7em;height:1.7em;}
  .rq.on{background:#fff;color:#2f7df6;}
  .hand.up{top:75%;left:44%;animation:hU 1.6s ease-in-out infinite;}
  @keyframes hL{0%{transform:none;opacity:0}15%{opacity:1}80%{transform:translateX(-7em);opacity:1}100%{transform:translateX(-7em);opacity:0}}
  @keyframes hR{0%{transform:none;opacity:0}15%{opacity:1}80%{transform:translateX(7em);opacity:1}100%{transform:translateX(7em);opacity:0}}
  @keyframes hD{0%{transform:none;opacity:0}15%{opacity:1}80%{transform:translateY(7em);opacity:1}100%{transform:translateY(7em);opacity:0}}
  @keyframes hU{0%{transform:none;opacity:0}15%{opacity:1}80%{transform:translateY(-7em);opacity:1}100%{transform:translateY(-7em);opacity:0}}
  /* app windows */
  .win{flex:1;min-height:0;background:#fff;color:#1c1c22;display:flex;flex-direction:column;overflow:hidden;}
  .win .bar2{padding:.7em 1em;font-weight:800;font-size:1.05em;display:flex;align-items:center;gap:.6em;flex:0 0 auto;}
  .win .body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;}
  .row{display:flex;align-items:center;gap:.8em;padding:.75em 1em;border-bottom:1px solid #eee;font-size:.9em;}
  .row .av{flex:0 0 2.6em;height:2.6em;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;}
  .row b{display:block;}.row small{display:block;color:#777;font-size:.85em;margin-top:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .tx{flex:1;min-width:0;}
  .sw{flex:0 0 2.8em;height:1.6em;border-radius:1em;background:#ccc;position:relative;}
  .sw::after{content:"";position:absolute;top:.15em;left:.15em;width:1.3em;height:1.3em;border-radius:50%;background:#fff;transition:.2s;}
  .sw.on{background:#2f7df6;}.sw.on::after{left:1.35em;}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em;padding:.4em 1.6em;}
  .keys div{height:2.7em;border-radius:1.4em;background:#f0f1f5;display:grid;place-items:center;font-size:1.25em;font-weight:700;}
  .dial{font-size:1.6em;font-weight:700;text-align:center;min-height:1.6em;padding:.5em;letter-spacing:.06em;}
  .round{width:3.6em;height:3.6em;border-radius:50%;display:grid;place-items:center;margin:.4em auto;color:#fff;}
  .round svg{width:1.7em;height:1.7em;}
  .green{background:#22b45a;}.red{background:#e5412f;}
  .tabs{display:flex;border-top:1px solid #eee;flex:0 0 auto;}
  .tabs div{flex:1;text-align:center;padding:.7em;font-size:.82em;font-weight:700;color:#777;}
  .tabs div.on{color:#2f7df6;}
  .callscr{flex:1;background:linear-gradient(180deg,#1f2a44,#0f1524);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2em 1em 1.6em;text-align:center;}
  .callscr .who{font-size:1.5em;font-weight:800;}
  .callscr .st{opacity:.75;margin-top:.3em;font-size:.9em;}
  .callscr .btns{display:flex;gap:2.2em;align-items:flex-end;}
  .cbtn{display:flex;flex-direction:column;align-items:center;gap:.3em;font-size:.72em;font-weight:700;border-radius:1em;padding:.2em;}
  .cbtn i{width:4.4em;height:4.4em;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-style:normal;}
  .cbtn i svg{width:2em;height:2em;}
  .cbtn.on i{background:#fff;color:#1f2a44;}
  .ring{animation:ringa .8s ease-in-out infinite;}
  @keyframes ringa{50%{transform:scale(1.12);}}
  .chat{flex:1;background:#ece5dd;padding:.6em;display:flex;flex-direction:column;gap:.4em;justify-content:flex-end;overflow:hidden;}
  .bub{max-width:78%;padding:.5em .7em;border-radius:.8em;font-size:.88em;background:#fff;align-self:flex-start;box-shadow:0 1px 1px rgba(0,0,0,.1);}
  .bub.me{background:#d9fdd3;align-self:flex-end;}
  .bub small{color:#3b9be8;margin-inline-start:.4em;}
  .inp{display:flex;gap:.4em;padding:.4em;background:#ece5dd;align-items:center;flex:0 0 auto;}
  .inp .fld{flex:1;background:#fff;border-radius:1.4em;padding:.65em 1em;font-size:.9em;min-height:2.5em;color:#999;}
  .inp .fld.has{color:#111;}
  .inp .rb{flex:0 0 2.7em;height:2.7em;border-radius:50%;background:#22b45a;color:#fff;display:grid;place-items:center;}
  .inp .rb svg{width:1.4em;height:1.4em;}
  .inp .rb.rec{background:#e5412f;transform:scale(1.35);}
  .kb{background:#d5d8de;padding:.3em .15em .4em;flex:0 0 auto;}
  .kb .kr{display:flex;justify-content:center;gap:.16em;margin:.2em 0;}
  .kb .k{flex:1;max-width:2.2em;height:2.4em;background:#fff;border-radius:.35em;display:grid;place-items:center;font-size:.86em;font-weight:600;box-shadow:0 1px 0 #999;color:#111;}
  .kb .k.w{max-width:9em;flex:5;}.kb .k.g{background:#b4b9c2;max-width:3em;flex:1.6;}
  .mailrow.unread b{font-weight:800;}.mailrow b{font-weight:500;}
  .mailbody{padding:1em;font-size:.9em;line-height:1.5;}
  .warn{background:#ffe9e5;color:#b3261e;border-radius:.8em;padding:.6em .8em;font-weight:700;font-size:.85em;margin:.6em 1em;}
  .yt{background:#111;color:#fff;}
  .yts{background:#2a2a2a;border-radius:1.4em;padding:.55em 1em;flex:1;font-size:.85em;color:#bbb;display:flex;gap:.5em;align-items:center;}
  .chip{display:inline-block;background:#f0f1f5;color:#111;border-radius:1.2em;padding:.6em 1em;margin:.3em;font-size:.9em;font-weight:600;}
  .vid{margin:.5em .7em;border-radius:.8em;overflow:hidden;background:#222;}
  .vid .th{height:6.2em;display:grid;place-items:center;font-size:1.6em;}
  .vid .mt{padding:.5em .7em;font-size:.82em;font-weight:600;}
  .player{height:11em;position:relative;display:grid;place-items:center;font-size:1em;overflow:hidden;}
  .player .scene{font-size:3.4em;}
  .player.play .scene{animation:bob 1s ease-in-out infinite;}
  @keyframes bob{50%{transform:translateY(-.18em) rotate(4deg);}}
  .player .pp{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);}
  .player .pp svg{width:3em;height:3em;}
  .ad{position:absolute;inset:0;background:#ffcf33;color:#111;display:grid;place-items:center;font-weight:800;text-align:center;}
  .skip{position:absolute;right:.5em;bottom:.6em;background:rgba(0,0,0,.8);color:#fff;border-radius:.4em;padding:.6em .8em;font-size:.85em;font-weight:700;}
  .cam{flex:1;background:linear-gradient(180deg,#8fd3ff 0%,#d8f1ff 55%,#7fc56b 55%,#4f9a45 100%);position:relative;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;}
  .cam.front{background:linear-gradient(180deg,#f3d9c4,#e7b99a);}
  .cam .sc{position:absolute;inset:0 0 6.5em;display:grid;place-items:center;font-size:4em;}
  .cam .ctl{background:rgba(0,0,0,.55);display:flex;justify-content:space-around;align-items:center;padding:1em .6em 1.2em;position:relative;}
  .shut{width:4.2em;height:4.2em;border-radius:50%;background:#fff;border:.35em solid #bbb;}
  .cam .sm{width:3em;height:3em;border-radius:.8em;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:1em;}
  .cam .sm svg{width:1.6em;height:1.6em;}
  .flash{position:absolute;inset:0;background:#fff;animation:fl .35s forwards;pointer-events:none;z-index:9;}
  @keyframes fl{to{opacity:0;}}
  .gal{display:grid;grid-template-columns:repeat(3,1fr);gap:.2em;padding:.2em;}
  .gal div{aspect-ratio:1;display:grid;place-items:center;font-size:1.9em;background:#dfe9f5;}
  .big{flex:1;display:grid;place-items:center;font-size:6em;background:#111;}
  /* overlays */
  .ovl{position:absolute;inset:0;z-index:8;}
  .shade{background:rgba(20,22,30,.93);backdrop-filter:blur(8px);padding:2.4em .9em 1em;display:flex;flex-direction:column;gap:.7em;animation:sh .25s;}
  @keyframes sh{from{transform:translateY(-100%);}}
  .qs{display:grid;grid-template-columns:1fr 1fr;gap:.6em;}
  .q{background:rgba(255,255,255,.14);border-radius:1.2em;padding:.8em;display:flex;align-items:center;gap:.6em;font-size:.82em;font-weight:700;min-height:3.6em;}
  .q svg{width:1.6em;height:1.6em;flex:none;}
  .q.on{background:#2f7df6;}
  .q small{display:block;font-weight:500;opacity:.8;font-size:.9em;}
  .slider{background:rgba(255,255,255,.14);border-radius:1.2em;height:2.8em;position:relative;overflow:hidden;}
  .slider i{position:absolute;inset:0 auto 0 0;background:#fff;border-radius:1.2em;}
  .slider span{position:absolute;left:.7em;top:50%;transform:translateY(-50%);color:#f5a623;font-size:1.2em;}
  .note{background:rgba(255,255,255,.1);border-radius:1.2em;padding:.8em;font-size:.82em;}
  .amenu{background:rgba(0,0,0,.35);display:grid;place-items:center;}
  .amenu .m{background:#fff;color:#111;border-radius:1.2em;padding:.5em 0;min-width:11em;font-size:.9em;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);}
  .amenu .m div{padding:.75em 1.1em;}
  .vol{position:absolute;right:.6em;top:18%;z-index:9;width:2.6em;height:9em;border-radius:1.3em;background:rgba(30,32,40,.9);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;}
  .vol i{display:block;background:#fff;}
  .vol span{position:absolute;bottom:.5em;left:0;right:0;text-align:center;color:#2f7df6;}
  .lock{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3em 1em 2em;text-align:center;}
  .lock .clk{font-size:4em;font-weight:300;}
  .off{position:absolute;inset:0;background:#000;z-index:20;display:grid;place-items:center;color:#fff;}
  .popup{background:rgba(0,0,0,.6);display:grid;place-items:center;padding:1em;}
  .popup .p{background:#fff;color:#111;border-radius:1em;padding:1.2em 1em 1em;text-align:center;position:relative;font-size:.9em;border:.25em solid #e5412f;}
  .popup .x{position:absolute;top:.3em;right:.4em;width:2em;height:2em;display:grid;place-items:center;color:#777;font-size:1.1em;border-radius:50%;}
  .popup .okb{background:#e5412f;color:#fff;border-radius:.8em;padding:.9em;font-weight:800;margin-top:.8em;}
  .pmenu{background:rgba(0,0,0,.8);display:flex;flex-direction:column;gap:1.2em;align-items:center;justify-content:center;}
  .pmenu div{background:#fff;color:#111;border-radius:1.4em;padding:1em 1.6em;font-weight:800;min-width:11em;text-align:center;}
  .toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:40;background:var(--ok);color:#fff;font-weight:800;font-size:1em;white-space:nowrap;border-radius:2em;padding:.45em 1em;animation:toast .9s forwards;pointer-events:none;}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0}}
  .shake{animation:shake .35s;}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  @media (prefers-reduced-motion:reduce){.hl,.hand,.ring{animation-duration:3s;}}
</style>
