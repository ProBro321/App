plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv("VERSION_CODE") ?: "1") as Integer

android {
    namespace 'com.probro.wallet'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    buildFeatures {
        buildConfig true
    }

    // Two apps from one codebase. Each loads its own page and updates live from GitHub.
    flavorDimensions "app"
    productFlavors {
        wallet {
            dimension "app"
            applicationId 'com.probro.wallet'
            resValue "string", "app_name", "Wallet"
            buildConfigField "String", "APP_URL", '"https://probro321.github.io/App/"'
            buildConfigField "boolean", "MIGRATE_OLD", "true"
        }
        anime {
            dimension "app"
            applicationId 'com.probro.animelist'
            resValue "string", "app_name", "Anime List"
            buildConfigField "String", "APP_URL", '"https://probro321.github.io/App/anime/"'
            buildConfigField "boolean", "MIGRATE_OLD", "false"
        }
    }

    // One fixed signing key, so every new version installs over the old one
    // (Android refuses updates signed with a different key).
    signingConfigs {
        wallet {
            storeFile file('../wallet.keystore')
            storePassword 'walletapp'
            keyAlias 'wallet'
            keyPassword 'walletapp'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.wallet
        }
        debug {
            signingConfig signingConfigs.wallet
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.work:work-runtime:2.9.1'
}
